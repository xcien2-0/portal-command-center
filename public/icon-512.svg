<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="100" fill="#0a1628"/>
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a1f3c"/>
      <stop offset="100%" stop-color="#0d2d1a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00B4D8"/>
      <stop offset="100%" stop-color="#1db954"/>
    </linearGradient>
  </defs>
  <!-- X shape -->
  <line x1="130" y1="130" x2="382" y2="382" stroke="url(#accent)" stroke-width="50" stroke-linecap="round"/>
  <line x1="382" y1="130" x2="130" y2="382" stroke="url(#accent)" stroke-width="50" stroke-linecap="round"/>
  <!-- Dot indicator -->
  <circle cx="408" cy="108" r="36" fill="#00C896"/>
  <circle cx="408" cy="108" r="20" fill="#0a1628"/>
  <!-- Text XCIEN -->
  <text x="256" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="52" fill="#94a3b8" letter-spacing="12">XCIEN</text>
</svg>
