  </defs>
  <!-- X shape -->
  <line x1="52" y1="52" x2="140" y2="140" stroke="url(#accent)" stroke-width="18" stroke-linecap="round"/>
  <line x1="140" y1="52" x2="52" y2="140" stroke="url(#accent)" stroke-width="18" stroke-linecap="round"/>
  <!-- Dot indicator -->
  <circle cx="152" cy="44" r="12" fill="#00C896"/>
  <circle cx="152" cy="44" r="7" fill="#0a1628"/>
